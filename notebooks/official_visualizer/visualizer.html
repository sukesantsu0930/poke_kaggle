<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Official PTCG Visualizer Loader</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 32px;
      line-height: 1.6;
    }
    .path {
      font-family: Consolas, monospace;
      background: #f2f2f2;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .row {
      margin-top: 16px;
    }
    button {
      font-size: 16px;
      padding: 10px 18px;
      cursor: pointer;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }
    #status {
      margin-top: 12px;
      font-weight: bold;
    }
    .ok {
      color: #116b2f;
    }
    .error {
      color: #a40000;
    }
  </style>
</head>
<body>
  <h1>Official PTCG Visualizer Loader</h1>
  <p>Choose the replay JSON file generated by this project.</p>
  <p>Usually: <span class="path">experiments\visualizer\latest_replay.json</span></p>
  <div class="row">
    <input type="file" id="fileInput" accept=".json,application/json">
  </div>
  <div class="row">
    <button id="openButton" type="button" disabled>Open Official Visualizer</button>
  </div>
  <div id="status">No file selected.</div>
  <script>
    let visualizerJson = "";
    const status = document.getElementById('status');
    const openButton = document.getElementById('openButton');

    function setStatus(message, className) {
      status.textContent = message;
      status.className = className || "";
    }

    document.getElementById('fileInput').addEventListener('change', function(event) {
      const file = event.target.files[0];
      visualizerJson = "";
      openButton.disabled = true;
      if (!file) {
        setStatus("No file selected.", "");
        return;
      }
      setStatus("Loading: " + file.name, "");
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const obj = JSON.parse(e.target.result);
          if ("steps" in obj) {
            visualizerJson = JSON.stringify(obj["steps"][0][0]["visualize"]);
          } else {
            visualizerJson = e.target.result;
          }
          openButton.disabled = false;
          setStatus("Loaded: " + file.name + " . Press the button.", "ok");
        } catch (error) {
          setStatus("ERROR: JSON could not be read. " + error.message, "error");
        }
      };
      reader.onerror = function() {
        setStatus("ERROR: File could not be read.", "error");
      };
      reader.readAsText(file);
    });

    openButton.addEventListener('click', function() {
      if (!visualizerJson) {
        setStatus("ERROR: Select latest_replay.json first.", "error");
        return;
      }

      const input = document.createElement("input");
      input.type = "hidden";
      input.name = "json";
      input.value = visualizerJson;

      const form = document.createElement("form");
      form.method = "POST";
      form.action = "https://ptcgvis.heroz.jp/Visualizer/Replay/0";
      form.target = "_blank";
      form.appendChild(input);

      document.body.appendChild(form);
      setStatus("Sending replay to the official Visualizer...", "ok");
      form.submit();
      form.remove();
    });
  </script>
</body>
</html>
