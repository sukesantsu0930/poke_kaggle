<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Official PTCG Visualizer Loader</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 32px;
      line-height: 1.6;
    }
    .path {
      font-family: Consolas, monospace;
      background: #f2f2f2;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Official PTCG Visualizer Loader</h1>
  <p>Choose the replay JSON file generated by this project.</p>
  <p>Usually: <span class="path">experiments\visualizer\latest_replay.json</span></p>
  <input type="file" id="fileInput" accept=".json,application/json">
  <script>
    document.getElementById('fileInput').addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (!file) {
        return;
      }
      const reader = new FileReader();
      reader.onload = function(e) {
        const obj = JSON.parse(e.target.result);

        const input = document.createElement("input");
        input.type = "hidden";
        input.name = "json";
        if ("steps" in obj) {
          input.value = JSON.stringify(obj["steps"][0][0]["visualize"]);
        } else {
          input.value = e.target.result;
        }

        const form = document.createElement("form");
        form.method = "POST";
        form.action = "https://ptcgvis.heroz.jp/Visualizer/Replay/0";
        form.target = "_blank";
        form.appendChild(input);

        document.body.appendChild(form);
        form.submit();
      };
      reader.readAsText(file);
    });
  </script>
</body>
</html>
